<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!--@head-->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body class="page">
    <!--@header-->

    <main id="content">
      <section class="page-hero">
        <!--@breadcrumbs-->
        <h1 class="title title--page">Bulk orders</h1>
        <p class="lede">Dum biryani for parties, office lunches and family events. Send us the date, the headcount and the dishes, and we will come back to you with a quote.</p>
      </section>

      <section class="section section--tight">
        <form class="form fade-up" data-request="Bulk order" data-whatsapp="{{whatsapp}}">
          <div class="form__row">
            <label class="field">
              <span class="field__label">Name</span>
              <input name="Name" type="text" autocomplete="name" required />
            </label>
            <label class="field">
              <span class="field__label">Phone</span>
              <input name="Phone" type="tel" autocomplete="tel" inputmode="tel" pattern="[0-9 +\-\(\)]{7,}" title="Phone number, digits only (spaces, + and - are fine)" required />
            </label>
          </div>
          <div class="form__row">
            <label class="field">
              <span class="field__label">Event date</span>
              <input name="Event date" type="date" required data-min-today />
            </label>
            <label class="field">
              <span class="field__label">Number of people</span>
              <input name="Number of people" type="number" min="1" required />
            </label>
          </div>
          <label class="field">
            <span class="field__label">Occasion or company <span class="field__hint">(optional)</span></span>
            <input name="Occasion or company" type="text" autocomplete="organization" />
          </label>
          <fieldset class="field checks">
            <legend class="field__label">Dishes</legend>
            <label><input type="checkbox" name="Dishes" value="Chicken dum biryani" /> Chicken dum biryani</label>
            <label><input type="checkbox" name="Dishes" value="Mutton dum biryani" /> Mutton dum biryani</label>
            <label><input type="checkbox" name="Dishes" value="Veg dum biryani" /> Veg dum biryani</label>
            <label><input type="checkbox" name="Dishes" value="Egg biryani" /> Egg biryani</label>
            <label><input type="checkbox" name="Dishes" value="Mirchi ka salan" /> Mirchi ka salan</label>
            <label><input type="checkbox" name="Dishes" value="Double ka meetha" /> Double ka meetha</label>
          </fieldset>
          <label class="field">
            <span class="field__label">Notes <span class="field__hint">(optional)</span></span>
            <textarea name="Notes" rows="4" placeholder="Delivery area, timing, spice level, anything else we should know"></textarea>
          </label>
          <div class="form__actions">
            <button class="btn btn--light" type="submit">Send request</button>
            <p class="form__note" data-off-note hidden>Online requests are not open yet.</p>
          </div>
        </form>
        <p class="next fade-up">Just a table for a few people? <a href="/reserve/">Reserve a table</a>.</p>
      </section>
    </main>

    <!--@footer-->

    <script type="module" src="/src/forms.js"></script>
  </body>
</html>
